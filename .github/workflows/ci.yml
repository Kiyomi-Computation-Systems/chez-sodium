name: CI

# One workflow, Linux only, on a pinned runner image (ADR-0010, ADR-0011).
#
# What is deliberately not here:
#   - A macOS runner. AGENTS.md: linux only (ADR-0010).
#   - The Guix container. Nothing in CI runs it: the toolchain here is Chez
#     built from its release tarball, and the runner's libsodium and packages
#     (packaging/debian-prereqs.txt). The site job alone installs from
#     packaging/debian-site-prereqs.txt.
#
# The jobs, all independent, and every one of them on every event below: each
# pull request, each push to main or a v* tag, and each run asked for from the
# Actions tab. No path filter: a check that a change skips is no check.
#   main        every action pinned to a commit, the runner's libsodium
#               reported, then found by discovery and accepted (ADR-0002's
#               install check) and asserted to be the floor, every check,
#               then the suites.
#   memory      the Valgrind gate (ADR-0011): the planted defects must fail
#               it, then every suite runs under it.
#   nothreads   every library under src/ must be refused, by name, on a Chez
#               built with --nothreads (ADR-0004).
#   floor       libsodium at its floor, built from a release tarball: its
#               soname, header and version checked, then make build and the
#               suites against it (ADR-0003).
#   current     the same against the current release, which the build script
#               pins.
#   site        the docs site (ADR-0013): the fetcher's offline test, then
#               make site-deps, make check-site and make site, on Ubuntu's
#               Chez and cmark-gfm, as pages.yml builds it to deploy.
#
# This workflow states no floor. scripts/ci/build-chez.sh takes no version and
# reads its own from packaging/floors.sexp, and so does any step that needs a
# floor, through scripts/ci/floor.sh (ADR-0011). `make check-floors` holds
# every file in this directory: no line may contain either floor's version, a
# comment included.
#
# Every action is pinned to a full commit SHA, with its tag in a comment: a
# tag can be moved to other code, a commit cannot. The main job's first check,
# scripts/ci/check-action-pins.sh, fails on any line with a uses key that is
# not exactly that. It reads text, so it cannot see a key spelled another
# way.
#
# `make check-ci` (tests/check-ci.sh), which make test runs, holds this file
# to the one shape it reads: these triggers, these six jobs and their keys,
# each check as a step's whole run line, no if: but on the caches' own steps,
# no continue-on-error:, no variable that would steer a check (but the two
# names floor and current hold, as exact env keys of the steps that run a
# libsodium build's check, make build and make test), and no key spelled so
# that a text check would miss it. A
# change to this file changes tests/check-ci.sh with it.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A pull request's runs share one group, its ref, and cancel-in-progress is
# true there: a new push to the pull request cancels its run in progress, and
# any run still pending. Every other run, a push to main or a tag, or a run
# asked for by hand, has a group of its own, its run id, so it never waits
# behind another and is never cancelled for a newer one.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Every Chez cache is keyed by what it holds: the floors file, which names the
# version, the scripts that read it, build and check it, the build's name (a
# threaded Chez and a --nothreads Chez are two entries), and the runner's OS
# release and architecture. Each cache is restored and saved in two steps, so
# a build is banked even when a later step fails. Every job builds what it
# needs: a cold cache costs each job a build, once, and the first to save
# wins. Whether it was built or restored, scripts/ci/check-chez.sh then asks
# the Chez itself for its version and (threaded?), so a cache that serves
# another build fails the job before any check runs on it. The two libsodium
# caches are keyed the same way, by the scripts that build and check them, the
# runner's image and the C compiler (and, for the floor's, by the floors file
# and its reader), and are checked after a restore as after a build.

jobs:
  main:
    name: main (checks and suites, Chez built from source)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      # Every line with a uses key in this directory is the form of a full
      # commit SHA with its tag in a comment. It needs only the checkout, so it
      # runs first.
      - name: Every action is pinned to a commit
        run: scripts/ci/check-action-pins.sh .github/workflows

      # The one package list. A failed grep must not become an empty install.
      - name: Install the packages in packaging/debian-prereqs.txt
        run: |
          pkgs=$(grep -v -e '^#' -e '^$' packaging/debian-prereqs.txt | tr '\n' ' ')
          if [ -z "$pkgs" ]; then
            echo "::error::packaging/debian-prereqs.txt yielded no packages: a broken step, not an empty list"
            exit 1
          fi
          sudo apt-get update -qq
          # shellcheck disable=SC2086
          sudo apt-get install -y --no-install-recommends $pkgs

      - name: Identify the runner image
        id: image
        run: |
          . /etc/os-release
          echo "id=${ID}-${VERSION_ID}-${RUNNER_ARCH}" >> "$GITHUB_OUTPUT"

      - name: Restore Chez
        id: chez
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/chez-threads
          key: chez-threads-${{ hashFiles('packaging/floors.sexp', 'scripts/ci/floor.sh', 'scripts/ci/build-chez.sh', 'scripts/ci/check-chez.sh') }}-${{ steps.image.outputs.id }}

      - name: Build Chez
        if: steps.chez.outputs.cache-hit != 'true'
        run: scripts/ci/build-chez.sh "$RUNNER_TEMP/chez-threads"

      - name: Save Chez
        if: steps.chez.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/chez-threads
          key: ${{ steps.chez.outputs.cache-primary-key }}

      - name: Check the Chez this job runs
        run: scripts/ci/check-chez.sh "$RUNNER_TEMP/chez-threads"

      - name: Report the versions this run uses
        run: |
          "$RUNNER_TEMP/chez-threads/bin/scheme" --version
          cc --version | head -n 1
          valgrind --version
          echo "image: ${ImageOS:-unknown} ${ImageVersion:-unknown}"
          echo "kernel: $(uname -r)"

      # The runner's own libsodium, which the main job tests: its packages, the
      # version its header names and the one the library answers. A report
      # only: the install check below, and the suites, hold the library to
      # its floor.
      - name: Report the runner's libsodium
        run: scripts/ci/report-sodium.sh

      # ADR-0002's install check. No line here names the override, so make
      # build finds the runner's libsodium by discovery, in the FHS world, and
      # must accept it: any refusal fails this step, with build's reason. The
      # file it found is the path line of this step's log.
      - name: The install check, by discovery
        env:
          CHEZ: ${{ runner.temp }}/chez-threads/bin/scheme
        run: make build

      # The library the install check found, with no override named, must be
      # the floor: only CI knows that this runner's package is meant to be it.
      # The step takes no argument, and no env but CHEZ.
      - name: The runner's libsodium is the floor
        env:
          CHEZ: ${{ runner.temp }}/chez-threads/bin/scheme
        run: scripts/ci/check-sodium.sh --discovery

      # CHEZ is the real binary, not a symlink or a wrapper. make test runs
      # check-ci, which holds this file's shape.
      - name: Checks and suites
        env:
          CHEZ: ${{ runner.temp }}/chez-threads/bin/scheme
        run: make check-help check-suites check-pins check-floors check-ci test check-test-fails check-dev check-clean

      # The launcher's own tests run no Guix: stand-ins take its place. They
      # need make test, so CHEZ too.
      - name: The launcher's host-side tests
        env:
          CHEZ: ${{ runner.temp }}/chez-threads/bin/scheme
        run: sh tests/guix-env-launcher.sh

  # The Valgrind gate, on every run (ADR-0011). The job proves the gate on its
  # own runner before the suites run, since the Valgrind and the Chez they run
  # under are that runner's own, installed or restored there. check-ci, which
  # make test and check-memory-gate's case o both run, requires the job to run
  # make check-memory-gate, then make test-memory, each as a step's whole run
  # line, and neither step to carry an if: or a continue-on-error: key. No
  # env: names a suite list or a Valgrind option.
  memory:
    name: memory (the Valgrind gate)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Install the packages in packaging/debian-prereqs.txt
        run: |
          pkgs=$(grep -v -e '^#' -e '^$' packaging/debian-prereqs.txt | tr '\n' ' ')
          if [ -z "$pkgs" ]; then
            echo "::error::packaging/debian-prereqs.txt yielded no packages: a broken step, not an empty list"
            exit 1
          fi
          sudo apt-get update -qq
          # shellcheck disable=SC2086
          sudo apt-get install -y --no-install-recommends $pkgs

      - name: Identify the runner image
        id: image
        run: |
          . /etc/os-release
          echo "id=${ID}-${VERSION_ID}-${RUNNER_ARCH}" >> "$GITHUB_OUTPUT"

      - name: Restore Chez
        id: chez
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/chez-threads
          key: chez-threads-${{ hashFiles('packaging/floors.sexp', 'scripts/ci/floor.sh', 'scripts/ci/build-chez.sh', 'scripts/ci/check-chez.sh') }}-${{ steps.image.outputs.id }}

      - name: Build Chez
        if: steps.chez.outputs.cache-hit != 'true'
        run: scripts/ci/build-chez.sh "$RUNNER_TEMP/chez-threads"

      - name: Save Chez
        if: steps.chez.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/chez-threads
          key: ${{ steps.chez.outputs.cache-primary-key }}

      - name: Check the Chez this job runs
        run: scripts/ci/check-chez.sh "$RUNNER_TEMP/chez-threads"

      # The gate proves nothing unless it can fail, so the planted defects run
      # first, on this job's own runner: a heap overrun and a definite leak
      # must each fail it, by Valgrind's own marker. Outside any Guix
      # environment, as in the container: no suppression is passed, and no
      # flag that hides a report.
      - name: The gate must fail on planted defects
        env:
          CHEZ: ${{ runner.temp }}/chez-threads/bin/scheme
        run: make check-memory-gate

      - name: Every suite under Valgrind
        env:
          CHEZ: ${{ runner.temp }}/chez-threads/bin/scheme
        run: make test-memory

  nothreads:
    name: nothreads (every library is refused on a Chez without threads)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the packages in packaging/debian-prereqs.txt
        run: |
          pkgs=$(grep -v -e '^#' -e '^$' packaging/debian-prereqs.txt | tr '\n' ' ')
          if [ -z "$pkgs" ]; then
            echo "::error::packaging/debian-prereqs.txt yielded no packages: a broken step, not an empty list"
            exit 1
          fi
          sudo apt-get update -qq
          # shellcheck disable=SC2086
          sudo apt-get install -y --no-install-recommends $pkgs

      - name: Identify the runner image
        id: image
        run: |
          . /etc/os-release
          echo "id=${ID}-${VERSION_ID}-${RUNNER_ARCH}" >> "$GITHUB_OUTPUT"

      - name: Restore Chez without threads
        id: chez
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/chez-nothreads
          key: chez-nothreads-${{ hashFiles('packaging/floors.sexp', 'scripts/ci/floor.sh', 'scripts/ci/build-chez.sh', 'scripts/ci/check-chez.sh') }}-${{ steps.image.outputs.id }}

      - name: Build Chez without threads
        if: steps.chez.outputs.cache-hit != 'true'
        run: scripts/ci/build-chez.sh "$RUNNER_TEMP/chez-nothreads" --nothreads

      - name: Save Chez without threads
        if: steps.chez.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/chez-nothreads
          key: ${{ steps.chez.outputs.cache-primary-key }}

      - name: Check the Chez this job runs
        run: scripts/ci/check-chez.sh "$RUNNER_TEMP/chez-nothreads" --nothreads

      # No submodules, no deps: the check imports only src/.
      - name: Every library must be refused, by name
        env:
          CHEZ: ${{ runner.temp }}/chez-nothreads/bin/scheme
        run: make check-nothreads

  # libsodium at its floor, built from its release tarball by
  # scripts/ci/build-sodium.sh. The suites must pass on it. The steps
  # that run its check, make build and make test carry the library and the
  # header directory of this build, exactly, and no other step of any job does.
  floor:
    name: floor (the suites against libsodium at its floor, built from source)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Install the packages in packaging/debian-prereqs.txt
        run: |
          pkgs=$(grep -v -e '^#' -e '^$' packaging/debian-prereqs.txt | tr '\n' ' ')
          if [ -z "$pkgs" ]; then
            echo "::error::packaging/debian-prereqs.txt yielded no packages: a broken step, not an empty list"
            exit 1
          fi
          sudo apt-get update -qq
          # shellcheck disable=SC2086
          sudo apt-get install -y --no-install-recommends $pkgs

      - name: Identify the runner image
        id: image
        run: |
          . /etc/os-release
          echo "id=${ID}-${VERSION_ID}-${RUNNER_ARCH}" >> "$GITHUB_OUTPUT"

      - name: Restore Chez
        id: chez
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/chez-threads
          key: chez-threads-${{ hashFiles('packaging/floors.sexp', 'scripts/ci/floor.sh', 'scripts/ci/build-chez.sh', 'scripts/ci/check-chez.sh') }}-${{ steps.image.outputs.id }}

      - name: Build Chez
        if: steps.chez.outputs.cache-hit != 'true'
        run: scripts/ci/build-chez.sh "$RUNNER_TEMP/chez-threads"

      - name: Save Chez
        if: steps.chez.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/chez-threads
          key: ${{ steps.chez.outputs.cache-primary-key }}

      - name: Check the Chez this job runs
        run: scripts/ci/check-chez.sh "$RUNNER_TEMP/chez-threads"

      # The compiler is in the key, so that a lane tests a library its own
      # image's compiler built: an image that moves cc rebuilds, and never
      # serves a library another compiler made.
      - name: Name the C compiler for the cache key
        id: cc
        run: echo "id=$(cc --version | head -n 1 | tr -c '[:alnum:].' '-')" >> "$GITHUB_OUTPUT"

      - name: Restore libsodium at its floor
        id: sodium
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/sodium-floor
          key: sodium-floor-${{ hashFiles('packaging/floors.sexp', 'scripts/ci/floor.sh', 'scripts/ci/build-sodium.sh', 'scripts/ci/check-sodium.sh') }}-${{ steps.image.outputs.id }}-${{ steps.cc.outputs.id }}

      - name: Build libsodium at its floor
        if: steps.sodium.outputs.cache-hit != 'true'
        env:
          CHEZ: ${{ runner.temp }}/chez-threads/bin/scheme
        run: scripts/ci/build-sodium.sh "$RUNNER_TEMP/sodium-floor"

      - name: Save libsodium at its floor
        if: steps.sodium.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/sodium-floor
          key: ${{ steps.sodium.outputs.cache-primary-key }}

      - name: Check the libsodium this job runs
        env:
          CHEZ: ${{ runner.temp }}/chez-threads/bin/scheme
          CHEZ_SODIUM_LIBRARY: ${{ runner.temp }}/sodium-floor/lib/libsodium.so.23
          C_INCLUDE_PATH: ${{ runner.temp }}/sodium-floor/include
        run: scripts/ci/check-sodium.sh "$RUNNER_TEMP/sodium-floor"

      - name: Load libsodium at its floor
        env:
          CHEZ: ${{ runner.temp }}/chez-threads/bin/scheme
          CHEZ_SODIUM_LIBRARY: ${{ runner.temp }}/sodium-floor/lib/libsodium.so.23
          C_INCLUDE_PATH: ${{ runner.temp }}/sodium-floor/include
        run: make build

      - name: The suites against libsodium at its floor
        env:
          CHEZ: ${{ runner.temp }}/chez-threads/bin/scheme
          CHEZ_SODIUM_LIBRARY: ${{ runner.temp }}/sodium-floor/lib/libsodium.so.23
          C_INCLUDE_PATH: ${{ runner.temp }}/sodium-floor/include
        run: make test

  # libsodium at the current release, built from its release tarball by
  # scripts/ci/build-sodium.sh --current. The suites must pass on it. The steps
  # that run its check, make build and make test carry the library and the
  # header directory of this build, exactly, and no other step of any job does.
  current:
    name: current (the suites against libsodium at the current release, built from source)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Install the packages in packaging/debian-prereqs.txt
        run: |
          pkgs=$(grep -v -e '^#' -e '^$' packaging/debian-prereqs.txt | tr '\n' ' ')
          if [ -z "$pkgs" ]; then
            echo "::error::packaging/debian-prereqs.txt yielded no packages: a broken step, not an empty list"
            exit 1
          fi
          sudo apt-get update -qq
          # shellcheck disable=SC2086
          sudo apt-get install -y --no-install-recommends $pkgs

      - name: Identify the runner image
        id: image
        run: |
          . /etc/os-release
          echo "id=${ID}-${VERSION_ID}-${RUNNER_ARCH}" >> "$GITHUB_OUTPUT"

      - name: Restore Chez
        id: chez
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/chez-threads
          key: chez-threads-${{ hashFiles('packaging/floors.sexp', 'scripts/ci/floor.sh', 'scripts/ci/build-chez.sh', 'scripts/ci/check-chez.sh') }}-${{ steps.image.outputs.id }}

      - name: Build Chez
        if: steps.chez.outputs.cache-hit != 'true'
        run: scripts/ci/build-chez.sh "$RUNNER_TEMP/chez-threads"

      - name: Save Chez
        if: steps.chez.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/chez-threads
          key: ${{ steps.chez.outputs.cache-primary-key }}

      - name: Check the Chez this job runs
        run: scripts/ci/check-chez.sh "$RUNNER_TEMP/chez-threads"

      # The compiler is in the key, so that a lane tests a library its own
      # image's compiler built: an image that moves cc rebuilds, and never
      # serves a library another compiler made.
      - name: Name the C compiler for the cache key
        id: cc
        run: echo "id=$(cc --version | head -n 1 | tr -c '[:alnum:].' '-')" >> "$GITHUB_OUTPUT"

      - name: Restore libsodium at the current release
        id: sodium
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/sodium-current
          key: sodium-current-${{ hashFiles('scripts/ci/build-sodium.sh', 'scripts/ci/check-sodium.sh') }}-${{ steps.image.outputs.id }}-${{ steps.cc.outputs.id }}

      - name: Build libsodium at the current release
        if: steps.sodium.outputs.cache-hit != 'true'
        env:
          CHEZ: ${{ runner.temp }}/chez-threads/bin/scheme
        run: scripts/ci/build-sodium.sh "$RUNNER_TEMP/sodium-current" --current

      - name: Save libsodium at the current release
        if: steps.sodium.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/sodium-current
          key: ${{ steps.sodium.outputs.cache-primary-key }}

      - name: Check the libsodium this job runs
        env:
          CHEZ: ${{ runner.temp }}/chez-threads/bin/scheme
          CHEZ_SODIUM_LIBRARY: ${{ runner.temp }}/sodium-current/lib/libsodium.so.26
          C_INCLUDE_PATH: ${{ runner.temp }}/sodium-current/include
        run: scripts/ci/check-sodium.sh "$RUNNER_TEMP/sodium-current" --current

      - name: Load libsodium at the current release
        env:
          CHEZ: ${{ runner.temp }}/chez-threads/bin/scheme
          CHEZ_SODIUM_LIBRARY: ${{ runner.temp }}/sodium-current/lib/libsodium.so.26
          C_INCLUDE_PATH: ${{ runner.temp }}/sodium-current/include
        run: make build

      - name: The suites against libsodium at the current release
        env:
          CHEZ: ${{ runner.temp }}/chez-threads/bin/scheme
          CHEZ_SODIUM_LIBRARY: ${{ runner.temp }}/sodium-current/lib/libsodium.so.26
          C_INCLUDE_PATH: ${{ runner.temp }}/sodium-current/include
        run: make test

  # The docs site, built as pages.yml builds it to deploy on a v* tag: Ubuntu's
  # Chez, below the library's floor, which is fine here, since nothing the site
  # runs imports a library under src/, where (chez-sodium private
  # require-threaded) refuses such a Chez; and Ubuntu's cmark-gfm, which
  # chez-cmark-gfm loads. chez-cmark-gfm comes from the archive Akku.lock pins
  # (make site-deps), and check-site-deps first holds the script that fetches
  # it to its offline test. The submodules are check-site's: make deps links
  # SRFI-64 for the generator's suites. It has no cache, so no if:, and no
  # SITE_REF: it builds the site for main, whose links to repository files name
  # main. check-ci holds the job at these seven steps: the checkout; the image
  # step, as every job has; the install step, line for line, to the text it
  # holds pages.yml's to, so the two cannot drift; and the four checks, each a
  # step's whole run line, in this order, each with CHEZ chezscheme. Only
  # check-ci sees a CHEZ lost: Ubuntu's package makes /usr/bin/scheme an
  # alternative for chezscheme, and make's own default CHEZ finds it.
  site:
    name: site (the docs site, on Ubuntu's Chez)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Identify the runner image
        id: image
        run: |
          . /etc/os-release
          echo "id=${ID}-${VERSION_ID}-${RUNNER_ARCH}" >> "$GITHUB_OUTPUT"

      # The site's own package list. A failed grep must not become an empty
      # install.
      - name: Install the packages in packaging/debian-site-prereqs.txt
        run: |
          pkgs=$(grep -v -e '^#' -e '^$' packaging/debian-site-prereqs.txt | tr '\n' ' ')
          if [ -z "$pkgs" ]; then
            echo "::error::packaging/debian-site-prereqs.txt yielded no packages: a broken step, not an empty list"
            exit 1
          fi
          sudo apt-get update -qq
          # shellcheck disable=SC2086
          sudo apt-get install -y --no-install-recommends $pkgs

      - name: Test the archive fetcher offline
        env:
          CHEZ: chezscheme
        run: make check-site-deps

      - name: Get chez-cmark-gfm as Akku.lock pins it
        env:
          CHEZ: chezscheme
        run: make site-deps

      - name: Gate the site
        env:
          CHEZ: chezscheme
        run: make check-site

      - name: Build the site
        env:
          CHEZ: chezscheme
        run: make site
